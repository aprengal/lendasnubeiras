openapi: 3.0.3

info:
  title: API de Lendas Nubeiras
  version: "0.2.1"
  description: >
    API REST que serve de intermediaria entre a aplicación Android Lendas
    Nubeiras e a base de datos do servidor.

    Os endpoints que requiren autenticación validan automaticamente a sesión
    mediante o rastro sesion_rastro, salvo que se indique expresamente o contrario.

    A API non devolve mensaxes de erro dependentes do idioma da aplicación.
    Os erros identifícanse mediante códigos HTTP.

    Cada endpoint admite un único método HTTP, POST ou GET, segundo se indica
    na súa definición. Se se emprega outro método, a API responde cun 405
    e indica o método válido na cabeceira Allow.

    O corpo das peticións JSON ten un límite máximo de 20000 caracteres.
    Se se supera este tamaño, a API responde cun código 413.

servers:
  - url: https://lendasnubeiras.duckdns.org

tags:
  - name: Autenticación
    description: Rexistro, inicio de sesión e validación da sesión.
  - name: Actividades
    description: Consulta e xestión das actividades.
  - name: Administración
    description: Xestión de usuarios, só para administradores.
  - name: Conta
    description: Xestión da propia conta do usuario.
  - name: Sistema
    description: Informes de erros e tarefas programadas.

paths:

  /rexistro:
    post:
      tags: [Autenticación]
      summary: Rexistrar un usuario novo
      description: >
        Rexistra un usuario a partir do seu correo electrónico. Envíase unha
        mensaxe cunha ligazón para verificar a acción. A ligazón é válida
        durante 15 minutos. Unha vez verificada, a solicitude queda pendente
        de aprobación administrativa.

        O correo envíase no idioma indicado no campo idioma.

        Permítense como máximo 3 intentos de rexistro por correo electrónico
        durante 24 horas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - correo
                - uuid
                - idioma
              properties:
                correo:
                  type: string
                  format: email
                  description: Correo electrónico co que se quere rexistrar o usuario.
                uuid:
                  type: string
                  format: uuid
                  description: Identificador único do dispositivo.
                idioma:
                  type: string
                  enum:
                    - gl
                    - es
                    - en
                  description: Idioma no que se envía o correo.
      responses:
        "200":
          description: A solicitude de rexistro foi procesada correctamente.
        "400":
          description: JSON mal formado, campos obrigatorios ausentes ou valores inválidos.
        "409":
          description: Xa existe unha conta ou unha situación de rexistro incompatible co novo rexistro.
        "429":
          description: Superouse o límite de 3 intentos de rexistro por correo nas últimas 24 horas.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /iniciar-sesion:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: >
        Solicita o inicio de sesión enviando ao correo do usuario unha ligazón
        de verificación. Devólvese a información da sesión e do usuario, pero
        a sesión non queda activa ata que se verifica a ligazón.

        Só se pode enviar unha mensaxe cada 60 segundos para o mesmo usuario.
        O correo envíase no idioma indicado no campo idioma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - correo
                - uuid
                - idioma
              properties:
                correo:
                  type: string
                  format: email
                  description: Correo electrónico do usuario.
                uuid:
                  type: string
                  format: uuid
                  description: Identificador único do dispositivo.
                idioma:
                  type: string
                  enum:
                    - gl
                    - es
                    - en
                  description: Idioma no que se envía o correo.
      responses:
        "200":
          description: Enviouse o correo de verificación e devólvese a información da sesión e do usuario.
          content:
            application/json:
              schema:
                type: object
                required:
                  - sesion
                  - id
                  - correo
                  - rol
                properties:
                  sesion:
                    type: string
                    description: Rastro cifrado da sesión (pendente de activación).
                  id:
                    type: integer
                    description: Identificador único do usuario.
                  correo:
                    type: string
                    format: email
                    description: Enderezo de correo electrónico do usuario.
                  rol:
                    type: string
                    description: Rol asignado ao usuario.
        "400":
          description: JSON mal formado, campos obrigatorios ausentes ou valores inválidos.
        "403":
          description: A conta non está activa, foi suspendida ou está en proceso de borrado.
        "404":
          description: O correo non está rexistrado.
        "429":
          description: Xa se enviou unha mensaxe para este usuario hai menos de 60 segundos.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /accion/verificacion:
    get:
      tags: [Autenticación]
      summary: Verificar unha acción
      description: >
        Verifica unha acción de rexistro, inicio de sesión ou borrado da conta
        mediante a ligazón enviada ao correo electrónico.

        As ligazóns caducan aos 15 minutos e só se poden usar unha vez.

        Ao verificar un rexistro, a solicitude queda pendente de aprobación
        administrativa. Ao verificar un inicio de sesión, actívase a sesión.
        Ao verificar un borrado, a conta péchase e queda pendente de eliminación
        definitiva aos 30 días.

        Os erros de verificación previstos devolven o mesmo código 409 para
        evitar revelar información sobre a validez do token. Isto inclúe
        parámetros ausentes ou inválidos, tokens descoñecidos, caducados ou
        xa utilizados.
      parameters:
        - name: id_accion
          in: query
          required: true
          description: >
            Token opaco que identifica a acción. O seu formato interno non
            forma parte do contrato público.
          schema:
            type: string
            minLength: 40
            maxLength: 40
            pattern: '^[a-zA-Z0-9]{40}$'
        - name: uuid
          in: query
          required: true
          description: >
            Identificador único do dispositivo. Debe coincidir co empregado
            ao solicitar a acción.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A acción foi verificada correctamente.
        "409":
          description: A acción non se puido verificar.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /sesion/validacion:
    post:
      tags: [Autenticación]
      summary: Validar a sesión actual
      description: >
        Comproba que a sesión enviada en sesion_rastro existe e segue activa, alóngaa e actívaa.
        Se a sesión non é válida, o usuario debe iniciar sesión de novo.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: A sesión foi validada e alongada correctamente.
        "401":
          description: A cookie falta, a sesión é inválida, caducou ou non está activa.
        "404":
          description: O usuario asociado á sesión non existe.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /conta/borrado:
    post:
      tags: [Conta]
      summary: Pedir o borrado da propia conta
      description: >
        Solicita o borrado da conta e envía unha ligazón de confirmación ao
        correo electrónico do usuario.

        Tras verificar a ligazón, a conta péchase e elimínase definitivamente
        aos 30 días. Nese momento, as actividades publicadas pasan ao usuario
        reservado e elimínanse os borradores, as actividades pendentes e as
        da papeleira.

        Durante ese prazo, un administrador pode cancelar o borrado cambiando
        o estado da conta mediante /axustar-usuarios.

        Os administradores non poden solicitar o borrado da súa propia conta.
        Só se pode enviar unha mensaxe cada 60 segundos.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - idioma
              properties:
                idioma:
                  type: string
                  enum:
                    - gl
                    - es
                    - en
                  description: Idioma no que se envía o correo.
      responses:
        "200":
          description: Enviouse o correo de confirmación do borrado.
        "400":
          description: JSON mal formado ou idioma ausente ou inválido.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: A conta non se pode borrar porque pertence a un administrador ou xa existe unha solicitude incompatible.
        "429":
          description: Xa se enviou unha mensaxe hai menos de 60 segundos.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

/actividade/actualizar:
  post:
    tags: [Actividades]
    summary: Actualizar o catálogo de actividades
    description: >
      Devolve a lista de actividades dispoñibles que pode ver o usuario.
      A sesión é opcional (admite uso anónimo). Require un intervalo mínimo de 60 segundos
      entre solicitudes identificadas pola uuid do dispositivo.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - uuid
            properties:
              uuid:
                type: string
                format: uuid
                description: Identificador único do dispositivo para o control de frecuencia (rate limiting).
    responses:
      "200":
        description: O catálogo actualizouse correctamente.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Actividade dispoñible.
      "400":
        description: JSON mal formado ou uuid ausente/inválido.
      "429":
        description: Superouse o límite de 1 solicitude cada 60 segundos por dispositivo.
      "405":
        $ref: "#/components/responses/MethodNotAllowed"
      default:
        $ref: "#/components/responses/UnexpectedError"

  /actividade/crear:
    post:
      tags: [Actividades]
      summary: Crear unha actividade
      description: >
        Crea unha actividade e engádea á base de datos. O servidor asigna
        o identificador da actividade e devólveo na resposta xunto co estado convertido.

        Os estados negativos son códigos temporais do cliente e deben
        transformarse no servidor:
        -1 corresponde a borrador (0),
        -2 corresponde a pendente (1),
        -3 corresponde a publicado (2).

        Os estados definitivos do servidor son 0, 1 e 2. Non se permite crear
        unha actividade directamente no estado 3 (borrada).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - clave_titulo
                - id_autoria
                - id_categoria
                - id_destinatario
                - estado
                - duracion
                - data_modificado
              properties:
                clave_titulo:
                  type: string
                  maxLength: 100
                  description: Clave do título da actividade.
                id_autoria:
                  type: integer
                  minimum: 0
                  description: Identificador do usuario autor.
                id_categoria:
                  type: string
                  maxLength: 15
                  description: Identificador da categoría.
                id_destinatario:
                  type: string
                  maxLength: 15
                  description: Identificador do destinatario.
                estado:
                  type: integer
                  enum:
                    - 0
                    - 1
                    - 2
                    - -1
                    - -2
                    - -3
                  description: >
                    Estado solicitado. Os valores negativos son temporais
                    do cliente e transfórmanse no servidor: -1 a 0, -2 a 1
                    e -3 a 2. O valor 3 non se admite na creación.
                duracion:
                  type: integer
                  minimum: 1
                  maximum: 180
                  description: Duración da actividade.
                data_modificado:
                  type: integer
                  minimum: 0
                  description: Marca temporal da última modificación.
      responses:
        "201":
          description: A actividade creouse correctamente.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - estado
                properties:
                  id:
                    type: integer
                    minimum: 1
                    description: Identificador asignado polo servidor.
                  estado:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                    description: Estado definitivo asignado polo servidor.
        "400":
          description: JSON mal formado, campos ausentes ou valores inválidos.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: O usuario non ten permisos para crear a actividade cos datos indicados.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /actividade/modificar:
    post:
      tags: [Actividades]
      summary: Modificar, borrar ou restaurar unha actividade
      description: >
        Modifica os datos dunha actividade. O campo estado indica a operación:
        0 para borrador, 1 para pendente, 2 para publicado e 3 para borrado.

        Envíanse todos os campos da actividade. Os identificadores deben
        corresponder a recursos válidos e o usuario debe ter permisos para
        realizar a operación.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - clave_titulo
                - id_autoria
                - id_categoria
                - id_destinatario
                - estado
                - duracion
                - data_modificado
              properties:
                id:
                  type: integer
                  minimum: 1
                  description: Identificador positivo da actividade no servidor.
                clave_titulo:
                  type: string
                  maxLength: 100
                  description: Clave do título da actividade.
                id_autoria:
                  type: integer
                  minimum: 0
                  description: Identificador do usuario autor.
                id_categoria:
                  type: string
                  maxLength: 15
                  description: Identificador da categoría.
                id_destinatario:
                  type: string
                  maxLength: 15
                  description: Identificador do destinatario.
                estado:
                  type: integer
                  enum:
                    - 0
                    - 1
                    - 2
                    - 3
                  description: "0 = borrador, 1 = pendente, 2 = publicado, 3 = borrado."
                duracion:
                  type: integer
                  minimum: 1
                  maximum: 180
                  description: Duración da actividade.
                data_modificado:
                  type: integer
                  minimum: 0
                  description: Marca temporal da última modificación.
      responses:
        "200":
          description: A actividade foi actualizada.
        "400":
          description: JSON mal formado, campos ausentes ou valores inválidos.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: O usuario non ten permisos para modificar esta actividade ou cambiar o seu estado/autoría.
        "404":
          description: A actividade non existe.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /reportar-erros:
    post:
      tags: [Sistema]
      summary: Rexistrar un erro da aplicación
      description: >
        Rexistra erros producidos na aplicación no servidor sen envialos a plataformas
        de terceiros. A petición require unha sesión válida. Os textos 
        demasiados longos son truncados polo servidor.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id_peticion
                - erro
              properties:
                id_peticion:
                  type: string
                  format: uuid
                  description: Identificador único da petición na que se produciu o erro.
                erro:
                  type: string
                  maxLength: 2000
                  description: Descrición do erro (máximo 2000 caracteres).
      responses:
        "200":
          description: O erro foi procesado correctamente.
        "400":
          description: JSON mal formado ou campos ausentes, baleiros ou inválidos.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /axustar-usuarios:
    post:
      tags: [Administración]
      summary: Xestionar usuarios
      description: >
        Só para administradores. Permite cambiar o rol, o correo electrónico
        ou o estado dunha conta.

        Cambiar o estado dunha conta en proceso de borrado cancela o borrado.
        O estado de borrado non se pode asignar desde este endpoint.
        O usuario reservado non se pode modificar.

        Debe indicarse polo menos un dos campos correo, rol ou estado.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
              properties:
                id:
                  type: integer
                  minimum: 1
                  description: Identificador do usuario que se quere modificar.
                correo:
                  type: string
                  format: email
                  description: Novo correo electrónico.
                rol:
                  type: string
                  enum:
                    - Monitor
                    - Colaborador
                    - Autor
                    - Editor
                    - Administrador
                  maxLength: 15
                  description: Novo rol do usuario.
                estado:
                  type: integer
                  enum:
                    - 0
                    - 1
                    - 2
                  description: "0 = pendente, 1 = activo, 2 = suspendido."
      responses:
        "200":
          description: O usuario foi actualizado correctamente.
        "400":
          description: JSON mal formado, identificador inválido, rol non válido ou ningún campo que modificar.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: O usuario autenticado non é administrador ou non ten permisos suficientes.
        "404":
          description: O usuario que se quere modificar non existe.
        "409":
          description: O usuario indicado é o usuario reservado ou o correo xa está en uso por outro usuario.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /limpar:
    get:
      tags: [Sistema]
      summary: Executar as tarefas programadas
      description: >
        Executa as tarefas programadas do servidor sen requirir unha sesión
        de usuario.

        Elimina os datos temporais caducados, elimina definitivamente as
        actividades que levan máis de 30 días borradas e elimina as contas
        cuxo período de borrado superou os 30 días. As actividades publicadas
        desas contas pasan ao usuario reservado.
      responses:
        "204":
          description: As tarefas programadas executáronse correctamente; non se devolve corpo.
        "409":
          description: Xa hai unha execución das tarefas programadas en curso.
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sesion_rastro

  responses:
    Unauthenticated:
      description: Houbo un problema coa sesión actual (cookie ausente ou inválida) e é preciso iniciar sesión outra vez.
    MethodNotAllowed:
      description: A petición non pode procesarse porque o método HTTP empregado non é o correcto. A resposta inclúe a cabeceira Allow.
      headers:
        Allow:
          description: Método HTTP válido para o endpoint.
          schema:
            type: string
    UnexpectedError:
      description: Erro inesperado no servidor.